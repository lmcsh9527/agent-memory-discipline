<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Memory and Discipline System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- left: titles -->
  <text x="64" y="118" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#e6edf3">Agent Memory &amp; Discipline</text>
  <text x="64" y="162" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#8b949e">Keeping long-session agents on-script — measured, mechanism-first.</text>

  <!-- three pillars -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#c9d1d9">
    <rect x="64"  y="196" width="330" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="94" cy="224" r="7" fill="#58a6ff"/>
    <text x="114" y="231">Slim fixed injections −35%</text>

    <rect x="424" y="196" width="330" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="454" cy="224" r="7" fill="#7ee787"/>
    <text x="474" y="231">On-demand recall ≤600 chars</text>

    <rect x="784" y="196" width="352" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="814" cy="224" r="7" fill="#f0883e"/>
    <text x="834" y="231">Safe compaction + loss guard</text>
  </g>

  <!-- right ornament: loop -->
  <g transform="translate(985,52)" opacity="0.95">
    <path d="M60 12 A48 48 0 1 1 12 60" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <polygon points="6,44 26,64 2,68" fill="#58a6ff"/>
    <text x="34" y="46" text-anchor="middle" font-family="monospace" font-size="17" fill="#e6edf3">recall</text>
    <text x="34" y="88" text-anchor="middle" font-family="monospace" font-size="15" fill="#8b949e">capture</text>
  </g>

  <!-- footer strip -->
  <rect x="0" y="284" width="1200" height="16" fill="url(#accent)" opacity="0.85"/>
</svg>
